<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C16" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="blueBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas with Ambient Blue Glow -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="400" cy="250" r="220" fill="#1976D2" opacity="0.18" filter="url(#softGlow)" />

  <!-- Centered Mobile Screen Mockup -->
  <g transform="translate(260, 40)" filter="url(#cardShadow)">
    <!-- Phone Screen Body -->
    <rect width="280" height="420" rx="28" fill="#FFFFFF" />

    <!-- LE Monogram Logo -->
    <g transform="translate(140, 110)">
      <!-- Serif L -->
      <path d="M -45 -60 L -15 -60 L -15 25 L 20 25 L 20 45 L -45 45 Z" fill="#1565C0" />
      <!-- Serif E intertwined -->
      <path d="M -10 -40 L 40 -40 L 40 -20 L 12 -20 L 12 -5 L 35 -5 L 35 12 L 12 12 L 12 25 L 42 25 L 42 42 L -10 42 Z" fill="#1E88E5" />
      <!-- LERNA text -->
      <text x="0" y="75" font-family="'Times New Roman', Georgia, serif" font-size="22" font-weight="bold" fill="#1565C0" text-anchor="middle" letter-spacing="4">
        LERNA
      </text>
    </g>

    <!-- Subtitle text -->
    <text x="140" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle" font-weight="500">
      Masuk atau daftar sebelum melanjutkan
    </text>

    <!-- MASUK Button -->
    <rect x="35" y="250" width="210" height="38" rx="19" fill="url(#blueBtn)" />
    <text x="140" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      MASUK
    </text>

    <!-- DAFTAR Button -->
    <rect x="35" y="300" width="210" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="140" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle" letter-spacing="1.5">
      DAFTAR
    </text>

    <!-- Divider Line -->
    <line x1="50" y1="358" x2="230" y2="358" stroke="#E2E8F0" stroke-width="1" />
    <text x="140" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94A3B8" text-anchor="middle">
      Atau masuk melalui sosial media anda
    </text>

    <!-- Google G Logo Circle -->
    <circle cx="140" cy="396" r="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(133, 389) scale(0.6)">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.51h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.34z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </g>
  </g>
</svg>
